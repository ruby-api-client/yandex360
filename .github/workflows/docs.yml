name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "lib/**"
      - "README.md"

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.324.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install YARD for documentation
        run: gem install yard

      - name: Generate API documentation
        run: yard doc --no-output --fail-on-warning

      - name: Check README links
        uses: tcort/github-action-markdown-link-check@v1.1.2
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: ".github/markdown-link-check.json"

      # The reference lists every public method, and it drifted before: it
      # described ten of seventeen resources while the guide above it described
      # all of them.
      - name: Check the API reference against the code
        run: bundle exec rake docs:check

      - name: Validate code examples in README
        run: |
          echo "Checking the syntax of Ruby examples in the READMEs..."
          # Each fenced block is checked on its own. Concatenating them, or
          # grepping a fixed number of lines after each fence, mixes unrelated
          # snippets and surrounding prose into a single invalid program.
          dir="$(mktemp -d)"
          for md in README.md README.ru.md; do
            awk -v d="$dir" -v p="$(basename "$md" .md)" '
              /^```ruby$/ { n++; inblock = 1; next }
              /^```/      { inblock = 0; next }
              inblock     { print > (d "/" p "_" n ".rb") }
            ' "$md"
          done
          status=0
          for block in "$dir"/*.rb; do
            if ! ruby -c "$block" > /dev/null; then
              echo "::error::Syntax error in $(basename "$block")"
              status=1
            fi
          done
          echo "Checked $(ls -1 "$dir" | wc -l) block(s)."
          exit $status

  # CHANGELOG.md is written by hand. The job that used to regenerate it on
  # every push rebuilt the whole file from merged pull requests, so it could
  # only ever produce a flat list of titles, never a record of what actually
  # breaks for a user. It also ran on branch pushes rather than releases, which
  # is why 2.0.0 came and went without leaving a trace in it.
  #
  # The release notes on GitHub are still generated from pull requests, which
  # is the right job for that tool.

  changelog-updated:
    name: Changelog Updated
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      # A reminder, not a gate: plenty of changes under lib/ are refactors that
      # no user needs to read about.
      - name: Check whether CHANGELOG.md was touched
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          if git diff --name-only "$base"...HEAD | grep -qx "CHANGELOG.md"; then
            echo "CHANGELOG.md is part of this change."
          else
            echo "::warning::lib/ changed but CHANGELOG.md did not. Add an entry under Unreleased if this is visible to users."
          fi
