name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "lib/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "lib/**"
      - "README.md"

jobs:
  validate-docs:
    name: Validate Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.324.0
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Install YARD for documentation
        run: gem install yard

      - name: Generate API documentation
        run: yard doc --no-output --fail-on-warning

      - name: Check README links
        uses: tcort/github-action-markdown-link-check@v1.1.2
        with:
          use-quiet-mode: "yes"
          use-verbose-mode: "yes"
          config-file: ".github/markdown-link-check.json"

      - name: Validate code examples in README
        run: |
          echo "Checking the syntax of Ruby examples in the READMEs..."
          # Each fenced block is checked on its own. Concatenating them, or
          # grepping a fixed number of lines after each fence, mixes unrelated
          # snippets and surrounding prose into a single invalid program.
          dir="$(mktemp -d)"
          for md in README.md README.ru.md; do
            awk -v d="$dir" -v p="$(basename "$md" .md)" '
              /^```ruby$/ { n++; inblock = 1; next }
              /^```/      { inblock = 0; next }
              inblock     { print > (d "/" p "_" n ".rb") }
            ' "$md"
          done
          status=0
          for block in "$dir"/*.rb; do
            if ! ruby -c "$block" > /dev/null; then
              echo "::error::Syntax error in $(basename "$block")"
              status=1
            fi
          done
          echo "Checked $(ls -1 "$dir" | wc -l) block(s)."
          exit $status

  update-changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Generate changelog
        uses: mikepenz/release-changelog-builder-action@v6.3.0
        with:
          configuration: ".github/changelog_config.json"
          outputFile: "CHANGELOG.md"
          fromTag: ""
          toTag: "HEAD"

      - name: Commit changelog
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update changelog"
          git push
